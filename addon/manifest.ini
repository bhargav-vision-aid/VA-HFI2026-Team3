name = Indian_Sarvam_AI_TTS
summary = "Indian Sarvam AI TTS"
description = """Indian Sarvam AI TTS is an NVDA synthesizer add-on that enables high quality cloud-based speech synthesis using the Sarvam AI Text-to-Speech API.

🔊 Features
• Natural sounding neural voices
• Multiple Indian language voices
• Cloud powered speech synthesis
• Adjustable speech rate
• API key configuration through NVDA settings

🌐 Supported Languages
supports major Indian languages including Hindi, Bengali, Tamil, Telugu, Gujarati, Kannada, Malayalam, Marathi, Punjabi, Odia and English.

⚙ Setup
1. Open NVDA Settings.
2. Navigate to 'Sarvam AI Speech'.
3. Paste your Sarvam API key.
4. Select 'Indian Sarvam AI TTS' from NVDA synthesizer list.

To obtain an API key visit the Sarvam AI dashboard."""
